# Dependabot propone cada semana las actualizaciones de las dependencias, en un PR por ecosistema con las menores y
# los parches juntos. Pasan por los mismos checks que cualquier PR a main.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      menores:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /escritorio
    schedule:
      interval: weekly
    # Wails va fijado en una beta con replace (docs/equipo/pendientes.md): se revisa a mano en cada beta.
    ignore:
      - dependency-name: github.com/wailsapp/wails/v3
    groups:
      menores:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      menores:
        update-types: [minor, patch]
