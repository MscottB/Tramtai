# Pruebas en cada push y pull request: el servicio y la CLI en Windows, Linux y macOS, la app de escritorio en Windows
# y la Web UI (tipos y compilación). Publicar también lo llama antes de crear un release.
name: CI

on:
  workflow_call:
  push:
    branches: [main]
    paths-ignore: ['site/**', '.github/workflows/paginas.yml', 'Casks/**', 'Formula/**', 'paquetes/**', 'docs/**', '**/*.md']  # la página y los paquetes van aparte
  # En los PR siempre: main exige estos checks para fusionar, y un PR que solo toca docs se quedaría sin ellos.
  pull_request:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior, que ya no sirve.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Las pruebas comparan algunos textos en español, el idioma de origen; los runners de macOS están en inglés.
env:
  TRAMTAI_IDIOMA: es

# Cada job tiene un tope (timeout-minutes): un espejo o una descarga colgados fallan pronto en vez de gastar las 6 h que
# GitHub deja por defecto. Los topes doblan de sobra lo que tarda cada job hoy.
jobs:
  go:
    name: Go (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum' # también los módulos de la app de escritorio
      - run: go vet ./...
      # go test ./... incluye TestAlDia (internal/contrato/gents): falla si web/src/api/tipos.gen.ts no es lo que se
      # genera hoy desde los structs de Go, o si no se subió.
      - run: go test ./...
      # govulncheck se instala con hasta tres intentos: un corte de red al verificarlo en sum.golang.org no es un fallo
      # del código. Se instala para Linux y la app de escritorio se analiza con GOOS=windows (con go run saldría un .exe).
      - name: govulncheck
        if: runner.os == 'Linux'
        run: for intento in 1 2 3; do go install golang.org/x/vuln/cmd/govulncheck@v1.8.0 && exit 0; sleep 20; done; exit 1
      - name: Dependencias de Go sin vulnerabilidades conocidas
        if: runner.os == 'Linux'
        run: '"$(go env GOPATH)/bin/govulncheck" ./...'
      # La app de escritorio se analiza como la de Windows: en Linux necesitaría las cabeceras de GTK para compilar.
      - name: App de escritorio sin vulnerabilidades conocidas
        if: runner.os == 'Linux'
        working-directory: escritorio
        run: GOOS=windows "$(go env GOPATH)/bin/govulncheck" ./...
      # Una orden por paso: en Windows (pwsh) un paso de varias órdenes solo falla si falla la última.
      - name: App de escritorio (vet)
        if: runner.os == 'Windows'
        working-directory: escritorio
        run: go vet ./...
      - name: App de escritorio (pruebas)
        if: runner.os == 'Windows'
        working-directory: escritorio
        run: go test ./...
      # Publicar se lanza desde una etiqueta, y una etiqueta solo ve la caché de main: aquí se deja wails3 en ella para
      # no compilarlo en cada release.
      - name: wails3 en caché para Publicar
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: ~/go/bin/wails3.exe
          key: wails3-v3.0.0-beta.28-${{ runner.os }}
      - name: wails3
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main'
        run: if (-not (Test-Path "$env:USERPROFILE\go\bin\wails3.exe")) { go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28 }

  # Prepara de verdad el conversor con el uv fijado y el lock, y convierte las muestras: comprueba en cada sistema que
  # el lock sirve y que scripts/uv.sh y uv.ps1 descargan lo esperado.
  conversor:
    name: Conversor (${{ matrix.os }})
    timeout-minutes: 35 # la prueba real tiene su propio tope de 25 min
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: uv fijado (Linux y macOS)
        if: runner.os != 'Windows'
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) objetivo=x86_64-unknown-linux-musl ;;
            Darwin-arm64) objetivo=aarch64-apple-darwin ;;
            *) echo "sistema sin uv fijado: $(uname -sm)"; exit 1 ;;
          esac
          sh scripts/uv.sh "$objetivo" "$RUNNER_TEMP/uv"
          echo "TRAMTAI_UV=$RUNNER_TEMP/uv/uv" >> "$GITHUB_ENV"
      - name: uv fijado (Windows)
        if: runner.os == 'Windows'
        run: |
          ./scripts/uv.ps1 -Objetivo x86_64-pc-windows-msvc -Destino "$env:RUNNER_TEMP\uv"
          "TRAMTAI_UV=$env:RUNNER_TEMP\uv\uv.exe" >> $env:GITHUB_ENV
      - name: Preparar el conversor y convertir las muestras
        run: go test -tags conversor -run TestConversorReal -v -timeout 25m ./internal/documentos
      # La matriz no ejecuta Intel Mac, macOS 11 ni Linux arm64: se comprueba que el lock tiene ruedas para todos.
      - name: El lock se instala en todos los objetivos
        if: runner.os == 'Linux'
        run: |
          for objetivo in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            MACOSX_DEPLOYMENT_TARGET=11.0 "$TRAMTAI_UV" pip install --dry-run --require-hashes --no-deps -r internal/documentos/conversor/conversor.lock \
              --python-platform "$objetivo" --python-version 3.12 --target "$RUNNER_TEMP/seco-$objetivo" || { echo "el lock no se instala en $objetivo"; exit 1; }
          done

  escritorio-linux:
    name: App de escritorio (Linux)
    timeout-minutes: 45 # con la caché de GTK vacía y el espejo de Ubuntu lento, la descarga puede tardar 25 min
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum' # también los módulos de la app de escritorio
      - name: GTK 4 y WebKitGTK 6.0
        uses: ./.github/actions/gtk
      - name: Compilar y probar
        working-directory: escritorio
        run: |
          go vet ./...
          go test ./...
      - name: Empaquetar e instalar el .deb (la app debe arrancar y levantar el servicio)
        run: |
          sh scripts/linux/empaquetar.sh v0.0.0+ci amd64
          sh scripts/linux/probar-paquete.sh

  # Publicar se lanza desde una etiqueta, que solo ve la caché de main: aquí se dejan en ella los paquetes de GTK de sus
  # dos runners (el CI usa otra imagen de Ubuntu).
  gtk-para-publicar:
    name: GTK en caché para Publicar (${{ matrix.runner }})
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/gtk

  escritorio-macos:
    name: App de escritorio (macOS)
    timeout-minutes: 25
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum' # también los módulos de la app de escritorio
      - name: Compilar, empaquetar y abrir la app
        run: |
          (cd escritorio && go vet ./... && go test ./...)
          # La app universal, como el release: un .dmg que no cabe en su imagen falla aquí y no al publicar.
          sh scripts/macos/empaquetar.sh v0.0.0+ci
          sh scripts/macos/probar-app.sh

  # Los ejemplos de la guía del desarrollador (docs/ejemplos) se ejecutan contra el servidor de la API con un agente
  # simulado: si uno se rompe, se sabe antes de publicar. Python con el uv fijado (scripts/uv.txt), Node 26 y Go del repo.
  ejemplos:
    name: Ejemplos
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true # el último parche de la 26, también los de seguridad, aunque la imagen del runner traiga otro
          cache: npm
          cache-dependency-path: docs/ejemplos/javascript/package-lock.json
      - name: Python con openai y requests (uv fijado)
        run: |
          sh scripts/uv.sh x86_64-unknown-linux-musl "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/uv" venv --python 3.13 "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/uv/uv" pip install --python "$RUNNER_TEMP/venv/bin/python" -r docs/ejemplos/python/requirements.txt
          echo "TRAMTAI_PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
      - name: SDK de OpenAI para Node
        working-directory: docs/ejemplos/javascript
        run: npm ci
      - name: Ejecutar cada ejemplo
        run: go test -tags ejemplos -run TestEjemplos -v ./internal/api/

  # Let's Encrypt integrado contra Pebble, la CA de pruebas de Let's Encrypt, con la validación de verdad
  # (PEBBLE_VA_ALWAYS_VALID=0): la prueba obtiene un certificado por TLS-ALPN-01. Pebble llega a la prueba, en el puerto
  # 5001 de su configuración, por tramtai.prueba, que --add-host apunta a esta máquina (host-gateway). La versión de
  # Pebble va fijada, y su raíz de pruebas (con la que sirve el directorio ACME) se baja de esa misma versión.
  pebble:
    name: Let's Encrypt (Pebble)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      pebble:
        image: ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
        ports:
          - 14000:14000
        env:
          PEBBLE_VA_ALWAYS_VALID: '0'
          PEBBLE_VA_NOSLEEP: '1' # sin las esperas al azar de la validación
        options: --add-host tramtai.prueba:host-gateway
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Raíz de pruebas de Pebble
        run: curl -sSfL -o "$RUNNER_TEMP/pebble.minica.pem" https://raw.githubusercontent.com/letsencrypt/pebble/v2.10.1/test/certs/pebble.minica.pem
      - name: Esperar a Pebble
        run: for intento in $(seq 30); do curl -sf --cacert "$RUNNER_TEMP/pebble.minica.pem" https://localhost:14000/dir >/dev/null && exit 0; sleep 1; done; exit 1
      - name: Certificado por TLS-ALPN-01
        env:
          PEBBLE_URL: https://localhost:14000/dir
          PEBBLE_CA: ${{ runner.temp }}/pebble.minica.pem
        run: go test -tags pebble -run Pebble -v ./internal/servicio/

  web:
    name: Web UI
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26 # la misma versión que en local: un fallo que solo sale en el CI cuesta más
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Dependencias sin vulnerabilidades conocidas (altas o críticas) y con firmas del registro verificadas
        run: |
          npm audit --audit-level=high
          npm audit signatures
      - run: npm test # funciones puras (plantillas y editor de campos) con node --test
      - run: npm run build # comprueba los tipos de los .vue con vue-tsc y compila
      # La Ayuda del sitio (site/ayuda), la 404, el sitemap y la cabeza, la barra y el pie de la portada y la guía salen de
      # web/scripts/sitio.ts y web/src/ayuda: lo guardado tiene que ser lo que sale de ahí. Lo mismo vale para los datos
      # que la terminal incrusta (internal/tui/datos: la Ayuda, las plantillas, los nombres del menú y los ejemplos), que
      # salen de web/scripts/terminal-datos.ts y que npm run sitio también regenera.
      - name: El sitio generado coincide con sus fuentes
        run: |
          npm run sitio
          git diff --exit-code --stat -- ../site ../internal/tui/datos || { echo "::error::genera el sitio y los datos de la terminal (cd web; npm run sitio) y súbelos"; exit 1; }
          test -z "$(git status --porcelain -- ../site ../internal/tui/datos)" || { echo "::error::hay archivos del sitio o de los datos de la terminal sin subir: cd web; npm run sitio"; exit 1; }
      # La Web UI compilada va en el repo (go build no necesita Node): tiene que ser la de web/src, o el release saldría
      # con la vieja. Las fuentes van con LF también en Windows (.gitattributes), así que el build es el mismo.
      - name: La Web UI compilada coincide con web/src
        run: git diff --exit-code --stat -- ../internal/recursos/web || { echo "::error::compila la Web UI (cd web; npm run build) y sube internal/recursos/web"; exit 1; }
