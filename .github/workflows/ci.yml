# Pruebas en cada push y pull request: el servicio y la CLI en Windows, Linux y macOS, la app de escritorio en Windows
# y la Web UI (tipos y compilación).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '.github/workflows/paginas.yml', 'Casks/**', 'Formula/**', 'paquetes/**']  # la página y los paquetes van aparte
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/paginas.yml', 'Casks/**', 'Formula/**', 'paquetes/**']

permissions:
  contents: read

# Las pruebas comparan algunos textos en español, el idioma de origen; los runners de macOS están en inglés.
env:
  TRAMTAI_IDIOMA: es

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS aún no se ha probado en un equipo real: su resultado informa pero no bloquea.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: App de escritorio
        if: runner.os == 'Windows'
        working-directory: escritorio
        run: |
          go vet ./...
          go test ./...

  escritorio-linux:
    name: App de escritorio (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: GTK 4 y WebKitGTK 6.0
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Compilar y probar
        working-directory: escritorio
        run: |
          go vet ./...
          go test ./...
      - name: Empaquetar e instalar el .deb (la app debe arrancar y levantar el servicio)
        run: |
          sh scripts/linux/empaquetar.sh v0.0.0+ci amd64
          sh scripts/linux/probar-paquete.sh

  escritorio-macos:
    name: App de escritorio (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compilar, empaquetar y abrir la app
        run: |
          (cd escritorio && go vet ./... && go test ./...)
          sh scripts/macos/empaquetar.sh v0.0.0+ci
          sh scripts/macos/probar-app.sh

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run build
