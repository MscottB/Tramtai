# Al subir una etiqueta vX.Y.Z+DDMMAAAA (scripts/version.ps1 -Etiquetar): compila, genera el instalador de Windows y
# publica el release con las notas de la etiqueta. Los binarios van al release, no a artefactos de Actions.
name: Publicar

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TRAMTAI_IDIOMA: es # las pruebas comparan textos en español; el runner está en inglés

jobs:
  unix:
    name: Linux y macOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Servicio y CLI para Linux y macOS (sin CGO)
        run: |
          version=$(pwsh -NoProfile -File scripts/version.ps1)
          [ "$version" = "$GITHUB_REF_NAME" ] || { echo "la versión calculada ($version) no coincide con la etiqueta"; exit 1; }
          mkdir -p dist
          for destino in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            so=${destino%/*}; arq=${destino#*/}; nombre=$so; [ "$so" = darwin ] && nombre=macos
            carpeta=$(mktemp -d)
            mkdir "$carpeta/tramtai"
            GOOS=$so GOARCH=$arq CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X tramtai/internal/version.Version=$version" -o "$carpeta/tramtai/tramtai" ./cmd/tramtai
            cp LICENSE.md "$carpeta/tramtai/LICENCIA.md"
            tar -C "$carpeta" -czf "dist/tramtai-$version-$nombre-$arq.tar.gz" tramtai
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: unix
          path: dist/
          retention-days: 1

  linux-app:
    name: App de escritorio (Linux ${{ matrix.arq }})
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arq: amd64 }
          - { runner: ubuntu-24.04-arm, arq: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: GTK 4 y WebKitGTK 6.0
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Compilar y empaquetar (.deb y .rpm)
        run: sh scripts/linux/empaquetar.sh "$GITHUB_REF_NAME" ${{ matrix.arq }}
      - name: Comprobar el paquete (instalar y arrancar sin pantalla)
        run: sh scripts/linux/probar-paquete.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app-${{ matrix.arq }}
          path: dist/
          retention-days: 1

  windows:
    needs: [unix, linux-app]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # version.ps1 calcula la versión desde las etiquetas
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Herramientas (wails3 para el icono y NSIS para el instalador)
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis -y --no-progress
          }
      - name: Pruebas
        run: |
          go test ./...
          cd escritorio; go test ./...
      - name: Compilar e instalador
        run: |
          $version = ./scripts/version.ps1
          if ($version -ne $env:GITHUB_REF_NAME) { throw "la versión calculada ($version) no coincide con la etiqueta $env:GITHUB_REF_NAME" }
          ./scripts/compilar.ps1 -Instalador
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sumas SHA-256 de todos los archivos
        run: |
          Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
        # checkout deja la etiqueta como ligera; se vuelve a traer anotada para usar sus notas.
        run: |
          git fetch --force origin "refs/tags/${env:GITHUB_REF_NAME}:refs/tags/${env:GITHUB_REF_NAME}"
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist -File).FullName --title "Tramtai $env:GITHUB_REF_NAME" --notes-from-tag --verify-tag
