# Compatibilidad de los CLI de los agentes (spec de la v0.60 › «Versiones comprobadas»). Cada semana, y a mano, prepara
# cada CLI con su receta en Linux, macOS y Windows Server como lo haría el servicio (cmd/compatibilidad): instala la
# última versión, lanza su inicio de sesión hasta el enlace y el código, sin cuenta, lo cancela, lo actualiza y lo
# desinstala. Lo que pasa en los tres sistemas se añade a la lista firmada del release fijo «compatibilidad», que
# Tramtai lee con su búsqueda diaria de versiones (internal/preparar, LeerLista); lo que no pasa abre (o comenta) un
# issue.
name: Compatibilidad de los agentes

on:
  schedule:
    - cron: '23 5 * * 1' # los lunes
  workflow_dispatch:
  # TEMPORAL (Tarea 13): workflow_dispatch no se puede lanzar hasta que el archivo esté en main. Se quita antes del PR.
  push:
    branches: ['v0.60/t13-*']
    paths: ['.github/workflows/agentes-compatibilidad.yml']

# Cada job pide lo suyo: leer en la matriz, que ejecuta los instaladores de terceros; escribir en el release solo al
# publicar; issues solo al avisar.
permissions: {}

concurrency:
  group: agentes-compatibilidad
  cancel-in-progress: false

jobs:
  comprobar:
    name: Comprobar (${{ matrix.os }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Sin caché: los instaladores son código de terceros y la caché de Go la leen otros jobs (también el que firma).
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # pwsh también en Linux y macOS: en Windows, bash pondría el tar de Git delante, y el instalador de Codex fallaría.
      - name: Instalar, iniciar sesión sin cuenta, actualizar y desinstalar cada CLI
        shell: pwsh
        run: go run ./cmd/compatibilidad comprobar "$env:RUNNER_TEMP/resultado/$env:RUNNER_OS.json"
      - uses: actions/upload-artifact@v7
        with:
          name: resultado-${{ runner.os }}
          path: ${{ runner.temp }}/resultado/
          retention-days: 7

  publicar:
    name: Juntar, firmar y publicar la lista
    needs: comprobar
    if: ${{ !cancelled() }} # un sistema sin resultado también se avisa
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      fallos: ${{ steps.juntar.outputs.fallos }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: resultado-*
          path: resultados
          merge-multiple: true
      # La lista publicada se amplía solo si su firma vale: nunca se vuelve a firmar algo que no firmó este job. Sin el
      # release se empieza de cero; un fallo de la consulta para el job (empezar de cero bajaría la version publicada).
      - name: Bajar la lista publicada
        run: |
          mkdir anterior
          if archivos=$(gh release view compatibilidad --json assets -q '.assets[].name' 2>&1); then
            if grep -qx compatibilidad.json <<< "$archivos"; then
              gh release download compatibilidad -p compatibilidad.json -p compatibilidad.json.sig -D anterior
              go run ./scripts/firmar -comprobar anterior/compatibilidad.json
            fi
          elif [ "$archivos" != 'release not found' ]; then
            echo "$archivos"
            exit 1
          fi
      - name: Juntar
        id: juntar
        run: |
          go build -o "$RUNNER_TEMP/compatibilidad" ./cmd/compatibilidad
          set +e
          "$RUNNER_TEMP/compatibilidad" juntar anterior/compatibilidad.json nueva/compatibilidad.json resultados/*.json > fallos.md
          codigo=$?
          set -e
          # La última versión de Antigravity sale del manifiesto que usan sus instaladores (DOWNLOAD_BASE_URL), sin
          # documentar (Ruling 12 de la v0.60): se avisa si deja de responder o si los instaladores cambian de sitio.
          manifiesto=$(grep -o 'https://antigravity-cli-auto-updater[^"]*' internal/agentes/antigravity/ficha.go)
          base=${manifiesto%%/manifests/*}
          curl -fsS --max-time 30 "$manifiesto" | grep -q '"version"' ||
            echo "- **antigravity**: el manifiesto $manifiesto no responde con su versión; ajusta Ultima en internal/agentes/antigravity/ficha.go" >> fallos.md
          for guion in install.sh install.ps1; do
            curl -fsSL --max-time 30 "https://antigravity.google/cli/$guion" | grep -qF "$base" ||
              echo "- **antigravity**: $guion ya no descarga de $base; ajusta Ultima en internal/agentes/antigravity/ficha.go" >> fallos.md
          done
          cat fallos.md
          if [ -s fallos.md ]; then echo 'fallos=si' >> "$GITHUB_OUTPUT"; fi
          if [ "$codigo" -ne 0 ] && [ "$codigo" -ne 2 ]; then exit "$codigo"; fi
          if [ -f nueva/compatibilidad.json ]; then cat nueva/compatibilidad.json; else echo 'Nada nuevo: no se publica.'; fi
      - name: Firmar la lista
        if: hashFiles('nueva/compatibilidad.json') != ''
        working-directory: nueva
        env:
          FIRMA_ACTUALIZACIONES: ${{ secrets.FIRMA_ACTUALIZACIONES }}
        run: go run ../scripts/firmar compatibilidad.json
      - name: Comprobar la firma con las claves públicas de la app
        if: hashFiles('nueva/compatibilidad.json') != ''
        working-directory: nueva
        run: go run ../scripts/firmar -comprobar compatibilidad.json
      # Previa, para que no cuente como versión de Tramtai (releases/latest y la lista de novedades la saltan).
      - name: Publicar en el release compatibilidad
        if: hashFiles('nueva/compatibilidad.json') != ''
        run: |
          gh release view compatibilidad > /dev/null 2>&1 ||
            gh release create compatibilidad --prerelease --title 'Versiones comprobadas de los CLI de los agentes' \
              --notes 'Lista firmada que publica cada semana el workflow «Compatibilidad de los agentes». No es una versión de Tramtai.'
          gh release upload compatibilidad nueva/compatibilidad.json nueva/compatibilidad.json.sig --clobber
      - uses: actions/upload-artifact@v7
        if: steps.juntar.outputs.fallos == 'si'
        with:
          name: fallos
          path: fallos.md
          retention-days: 7

  avisar:
    name: Avisar de lo que no pasó
    needs: publicar
    if: ${{ !cancelled() && needs.publicar.outputs.fallos == 'si' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: fallos
      # Un solo issue abierto: si ya lo hay, se comenta.
      - name: Abrir o comentar el issue
        run: |
          titulo='Compatibilidad de los agentes: algo no pasa con la receta'
          { echo "La [comprobación de esta semana]($EJECUCION) encontró esto (no se añadió a la lista firmada):"; echo; cat fallos.md; } > cuerpo.md
          numero=$(gh issue list --state open --search "\"$titulo\" in:title" --json number,title \
            -q ".[] | select(.title == \"$titulo\") | .number" | head -n 1)
          if [ -n "$numero" ]; then
            gh issue comment "$numero" --body-file cuerpo.md
          else
            gh issue create --title "$titulo" --body-file cuerpo.md
          fi
