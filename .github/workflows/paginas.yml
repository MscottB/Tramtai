# Publica la página de presentación (site/) en GitHub Pages cuando cambia. Requiere Settings → Pages → Source:
# «GitHub Actions».
name: Página

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/ejemplos/**', '.github/workflows/paginas.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # La guía del desarrollador muestra los ejemplos que ejecuta el CI, sin copiarlos a mano.
      - name: Ejemplos de la guía
        run: |
          mkdir -p site/ejemplos
          cp -r docs/ejemplos/python docs/ejemplos/javascript docs/ejemplos/go docs/ejemplos/curl docs/ejemplos/muestra.txt site/ejemplos/
          rm -rf site/ejemplos/javascript/node_modules
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: despliegue
        uses: actions/deploy-pages@v5
