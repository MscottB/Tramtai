# Publica la página de presentación (site/) en GitHub Pages cuando cambia. Requiere Settings → Pages → Source:
# «GitHub Actions».
name: Página

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/paginas.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: despliegue
        uses: actions/deploy-pages@v4
