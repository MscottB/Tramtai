# Mi configuración de Continue
name: Mi asistente   # nombre visible
version: 1.0.0
schema: v1

# Modelos
models:
  - name: Claude        # el de siempre
    provider: anthropic
    model: claude-sonnet-4
    apiKey: "sk-ant-xxx"   # no la compartas
    roles:
      - chat
      - edit

  # local, para probar
  - name: 'Llama local'
    provider: ollama
    model: llama3
    roles: [chat, autocomplete]

context:
  - provider: code
  - provider: docs

# fin del archivo
