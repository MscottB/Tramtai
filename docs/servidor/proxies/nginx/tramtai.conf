# nginx delante del servidor de Tramtai: HTTPS solo con TLS 1.3 en el 443, y Tramtai solo en este equipo
# (127.0.0.1:17373). Va en /etc/nginx/conf.d/ (o sites-available/ con su enlace en sites-enabled/).
# En /var/lib/tramtai/config.yaml (o %ProgramData%\Tramtai\config.yaml):
#   servicio:
#     dominios: [tramtai.example.com]
#     proxy:
#       confiables: [127.0.0.1/32]
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tramtai.example.com;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.3;
    # Intercambio de claves híbrido poscuántico; necesita OpenSSL 3.5 o posterior (con uno anterior, deja solo X25519).
    ssl_ecdh_curve X25519MLKEM768:X25519;

    location / {
        proxy_pass http://127.0.0.1:17373;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sin búfer: el flujo en vivo (SSE) llega trozo a trozo.
        proxy_buffering off;
        # Una petición larga mantiene la conexión abierta.
        proxy_read_timeout 1h;
        # Las cargas de archivos (conversion.maximo_carga_mb, 50 MB por defecto).
        client_max_body_size 64m;
    }
}
