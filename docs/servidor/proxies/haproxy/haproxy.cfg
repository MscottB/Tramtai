# HAProxy delante del servidor de Tramtai: HTTPS solo con TLS 1.3 en el 443, y Tramtai solo en este equipo
# (127.0.0.1:17373). El certificado y su clave van juntos en un .pem (cat fullchain.pem privkey.pem). HAProxy conserva
# el Host. En /var/lib/tramtai/config.yaml (o %ProgramData%\Tramtai\config.yaml):
#   servicio:
#     dominios: [tramtai.example.com]
#     proxy:
#       confiables: [127.0.0.1/32]
global
    ssl-default-bind-options ssl-min-ver TLSv1.3

defaults
    mode http
    timeout connect 5s
    timeout client 1m
    timeout server 1h
    # Sin búfer para el flujo en vivo (SSE): cada respuesta va por su conexión y puede durar hasta una hora.
    option http-server-close
    timeout tunnel 1h
    option forwardfor

frontend https
    bind :443 ssl crt /etc/haproxy/tls/tramtai.pem
    http-request set-header X-Forwarded-Proto https
    default_backend tramtai

backend tramtai
    server tramtai 127.0.0.1:17373
