# Traefik delante del servidor de Tramtai: HTTPS solo con TLS 1.3 en el 443, y Tramtai solo en este equipo
# (127.0.0.1:17373). Es la configuración dinámica (proveedor de archivos); en la estática hacen falta el punto de
# entrada y el archivo, por ejemplo:
#   traefik --entryPoints.websecure.address=:443 --providers.file.filename=/etc/traefik/dinamica/tramtai.yml
# Traefik conserva el Host y pone X-Forwarded-For, X-Forwarded-Proto y X-Forwarded-Host: sustituye lo que mande un
# cliente que no es de confianza.
# En /var/lib/tramtai/config.yaml (o %ProgramData%\Tramtai\config.yaml):
#   servicio:
#     host: 127.0.0.1
#     dominios: [tramtai.example.com]
#     proxy:
#       confiables: [127.0.0.1/32]
# No añadas HSTS (Strict-Transport-Security): lo pone Tramtai.
http:
  routers:
    tramtai:
      rule: Host(`tramtai.example.com`)
      entryPoints: [websecure]
      service: tramtai
      tls: {}
  services:
    tramtai:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:17373
        # Sin búfer: el flujo en vivo (SSE) llega trozo a trozo.
        responseForwarding:
          flushInterval: -1s

tls:
  options:
    # «default»: vale para todo el punto de entrada, también para un cliente que no manda el nombre (SNI).
    default:
      minVersion: VersionTLS13
  certificates:
    - certFile: /etc/traefik/tls/fullchain.pem
      keyFile: /etc/traefik/tls/privkey.pem
