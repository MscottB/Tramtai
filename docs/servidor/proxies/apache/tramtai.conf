# Apache httpd delante del servidor de Tramtai: HTTPS solo con TLS 1.3 en el 443, y Tramtai solo en este equipo
# (127.0.0.1:17373). Necesita mod_ssl, mod_proxy, mod_proxy_http y mod_headers (Debian y Ubuntu:
# a2enmod ssl proxy proxy_http headers; después a2ensite tramtai). Va en /etc/apache2/sites-available/ (Debian y Ubuntu)
# o en /etc/httpd/conf.d/ (RHEL).
# En /var/lib/tramtai/config.yaml (o %ProgramData%\Tramtai\config.yaml):
#   servicio:
#     dominios: [tramtai.example.com]
#     proxy:
#       confiables: [127.0.0.1/32]
<VirtualHost *:443>
    ServerName tramtai.example.com

    SSLEngine on
    SSLProtocol -all +TLSv1.3
    SSLCertificateFile    /etc/apache2/tls/fullchain.pem
    SSLCertificateKeyFile /etc/apache2/tls/privkey.pem

    # El Host del navegador, no 127.0.0.1; mod_proxy ya añade X-Forwarded-For y X-Forwarded-Host.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # flushpackets=on: sin búfer, el flujo en vivo (SSE) llega trozo a trozo; timeout para las peticiones largas.
    ProxyPass        / http://127.0.0.1:17373/ flushpackets=on timeout=3600
    ProxyPassReverse / http://127.0.0.1:17373/
</VirtualHost>
